<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Sign-ups</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0 auto;
            max-width: 1200px;
        }
        h1 {
            color: #5C6AC4;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
        select {
            padding: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #5C6AC4;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">Back to Signup</a>
    
    <h1>Show List of Students Who Signed-Up</h1>

    <div>
        <label>Select Your Club:</label>
        <select id="clubFilter">
            <option value="all">All</option>
            <option value="Badminton Club">Badminton Club</option>
            <option value="Basketball Club">Basketball Club</option>
            <option value="Volleyball Club">Volleyball Club</option>
            <option value="Ultimate Frisbee Club">Ultimate Frisbee Club</option>
            <option value="Bake Club">Bake Club</option>
            <option value="Computron">Computron</option>
            <option value="Himig Agham">Himig Agham</option>
        </select>
    </div>

    <div id="totalDisplay">Total Signup : 0</div>

    <div id="tableContainer"></div>

    <script>
        let allSignups = [];
        const signupData = localStorage.getItem("signups");
        
        if (signupData) {
            allSignups = JSON.parse(signupData);
        }
        
        const clubFilter = document.getElementById("clubFilter");
        const totalDisplay = document.getElementById("totalDisplay");
        const tableContainer = document.getElementById("tableContainer");
        
        function displaySignups(club = "all") {
            let filteredSignups = allSignups;
            
            if (club !== "all") {
                filteredSignups = allSignups.filter(signup => signup.club === club);
            }
            
            const total = filteredSignups.length;
            
            if (club === "all") {
                totalDisplay.textContent = `Total Signup : ${total}`;
            } else {
                totalDisplay.textContent = `Total Signup : ${total}`;
            }
            
            if (total === 0) {
                if (club === "all") {
                    tableContainer.innerHTML = '';
                } else {
                    tableContainer.innerHTML = 'No Sign Ups for the club';
                }
                return;
            }
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Club</th>
                            <th>ID</th>
                            <th>Fullname</th>
                            <th>Grade</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Intern\Extern</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            filteredSignups.forEach(signup => {
                tableHTML += `
                    <tr>
                        <td>${signup.club}</td>
                        <td>${signup.number}</td>
                        <td>${signup.uname}</td>
                        <td>${signup.grade}</td>
                        <td>${signup.email}</td>
                        <td>${signup.phonenumber}</td>
                        <td>${signup.status}</td>
                    </tr>
                `;
            });
            
            tableHTML += `
                    </tbody>
                </table>
            `;
            
            tableContainer.innerHTML = tableHTML;
        }
        
        clubFilter.addEventListener("change", function() {
            displaySignups(this.value);
        });
        
        displaySignups("all");
    </script>
</body>
</html>
